<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>Markdown Editor</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="codicons/codicon.css" />
    <link rel="stylesheet" href="dist/js/katex/katex.min.css" />
    <base href="{{baseUrl}}/">
</head>

<body>
    <div id="paper-reader-shell">
        <div id="paper-reader-toolbar" role="toolbar" aria-label="Markdown formatting">
            <button type="button" data-command="outline" title="大纲" aria-label="大纲" aria-pressed="false"><span class="codicon codicon-list-tree"></span></button>
            <button type="button" data-command="search" title="搜索与替换" aria-label="搜索与替换"><span class="codicon codicon-search"></span></button>
            <span class="paper-reader-toolbar-separator"></span>
            <button type="button" data-command="undo" title="撤销" aria-label="撤销"><span class="codicon codicon-discard"></span></button>
            <button type="button" data-command="redo" title="重做" aria-label="重做"><span class="codicon codicon-redo"></span></button>
            <span class="paper-reader-toolbar-separator"></span>
            <button type="button" data-command="heading" title="标题" aria-label="标题"><span class="codicon codicon-symbol-keyword"></span></button>
            <button type="button" data-command="heading-underline" title="标题下划线" aria-label="标题下划线" aria-pressed="true"><span class="codicon codicon-horizontal-rule"></span></button>
            <button type="button" data-command="bold" title="加粗" aria-label="加粗"><span class="codicon codicon-bold"></span></button>
            <button type="button" data-command="italic" title="斜体" aria-label="斜体"><span class="codicon codicon-italic"></span></button>
            <button type="button" data-command="strike" title="删除线" aria-label="删除线"><span class="codicon codicon-strikethrough"></span></button>
            <button type="button" data-command="link" title="链接" aria-label="链接"><span class="codicon codicon-link"></span></button>
            <span class="paper-reader-toolbar-separator"></span>
            <button type="button" data-command="unordered-list" title="无序列表" aria-label="无序列表"><span class="codicon codicon-list-unordered"></span></button>
            <button type="button" data-command="ordered-list" title="有序列表" aria-label="有序列表"><span class="codicon codicon-list-ordered"></span></button>
            <button type="button" data-command="checklist" title="任务列表" aria-label="任务列表"><span class="codicon codicon-checklist"></span></button>
            <button type="button" data-command="quote" title="引用" aria-label="引用"><span class="codicon codicon-quote"></span></button>
            <button type="button" data-command="inline-code" title="行内代码" aria-label="行内代码"><span class="codicon codicon-symbol-operator"></span></button>
            <button type="button" data-command="code-block" title="代码块" aria-label="代码块"><span class="codicon codicon-code"></span></button>
            <button type="button" data-command="table" title="表格" aria-label="表格"><span class="codicon codicon-table"></span></button>
            <button type="button" data-command="math" title="独立公式" aria-label="独立公式"><span class="codicon codicon-symbol-numeric"></span></button>
            <button type="button" data-command="image" title="图片" aria-label="图片"><span class="codicon codicon-file-media"></span></button>
            <button type="button" data-command="font-sizes" title="字号" aria-label="字号" aria-expanded="false"><span class="codicon codicon-text-size"></span></button>
            <span class="paper-reader-toolbar-spacer"></span>
            <button type="button" data-command="save" title="保存" aria-label="保存"><span class="codicon codicon-save"></span></button>
        </div>
        <div id="paper-reader-font-panel" role="dialog" aria-label="Markdown font sizes" hidden>
            <div class="paper-reader-font-panel-header">
                <strong>Font sizes</strong>
                <button type="button" data-font-action="close" title="Close" aria-label="Close font size settings"><span class="codicon codicon-close"></span></button>
            </div>
            <label>Body <span><input type="number" data-font-size="body" min="10" max="32" step="1" inputmode="numeric" /> px</span></label>
            <label>Inline math <span><input type="number" data-font-size="inlineMath" min="10" max="32" step="1" inputmode="numeric" /> px</span></label>
            <label>Display math <span><input type="number" data-font-size="displayMath" min="10" max="32" step="1" inputmode="numeric" /> px</span></label>
            <button type="button" class="paper-reader-font-reset" data-font-action="reset">Reset defaults</button>
        </div>
        <div id="paper-reader-workspace">
            <aside id="paper-reader-outline" aria-label="Document outline" hidden></aside>
            <div id="paper-reader-editor" aria-label="Paper Reader Markdown editor"></div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="vditor-context-menu paper-reader-context-menu" id="paper-reader-context-menu" role="menu" hidden>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item" type="button" data-action="sendSelectionToCodex" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-comment-discussion"></span>
                </span>
                <span class="vditor-context-menu__label">Add to Codex</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="addSelectionToNotes" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-notebook"></span>
                </span>
                <span class="vditor-context-menu__label">Add Note</span>
            </button>
        </div>
    </div>

</body>
    <script src="../lib/vscode.js"></script>
    <script src="codemirror.bundle.js"></script>

</html>
