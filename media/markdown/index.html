<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>Markdown Editor</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="codicons/codicon.css" />
    <link rel="stylesheet" href="dist/js/katex/katex.min.css" />
    <base href="{{baseUrl}}/">
</head>

<body>
    <div id="paper-reader-shell">
        <div id="paper-reader-toolbar" role="toolbar" aria-label="Markdown formatting">
            <button type="button" data-command="outline" title="Outline" aria-label="Outline" aria-pressed="false"><span class="codicon codicon-list-tree"></span></button>
            <button type="button" data-command="search" title="Search and replace" aria-label="Search and replace"><span class="codicon codicon-search"></span></button>
            <span class="paper-reader-toolbar-separator"></span>
            <button type="button" data-command="undo" title="Undo" aria-label="Undo"><span class="codicon codicon-discard"></span></button>
            <button type="button" data-command="redo" title="Redo" aria-label="Redo"><span class="codicon codicon-redo"></span></button>
            <span class="paper-reader-toolbar-separator"></span>
            <button type="button" data-command="heading" title="Heading" aria-label="Heading"><span class="codicon codicon-symbol-keyword"></span></button>
            <button type="button" data-command="bold" title="Bold" aria-label="Bold"><span class="codicon codicon-bold"></span></button>
            <button type="button" data-command="italic" title="Italic" aria-label="Italic"><span class="codicon codicon-italic"></span></button>
            <button type="button" data-command="strike" title="Strikethrough" aria-label="Strikethrough"><span class="codicon codicon-strikethrough"></span></button>
            <button type="button" data-command="link" title="Link" aria-label="Link"><span class="codicon codicon-link"></span></button>
            <span class="paper-reader-toolbar-separator"></span>
            <button type="button" data-command="unordered-list" title="Bulleted list" aria-label="Bulleted list"><span class="codicon codicon-list-unordered"></span></button>
            <button type="button" data-command="ordered-list" title="Numbered list" aria-label="Numbered list"><span class="codicon codicon-list-ordered"></span></button>
            <button type="button" data-command="checklist" title="Checklist" aria-label="Checklist"><span class="codicon codicon-checklist"></span></button>
            <button type="button" data-command="quote" title="Quote" aria-label="Quote"><span class="codicon codicon-quote"></span></button>
            <button type="button" data-command="inline-code" title="Inline code" aria-label="Inline code"><span class="codicon codicon-symbol-operator"></span></button>
            <button type="button" data-command="code-block" title="Code block" aria-label="Code block"><span class="codicon codicon-code"></span></button>
            <button type="button" data-command="table" title="Table" aria-label="Table"><span class="codicon codicon-table"></span></button>
            <button type="button" data-command="math" title="Display formula" aria-label="Display formula"><span class="codicon codicon-symbol-numeric"></span></button>
            <button type="button" data-command="image" title="Image" aria-label="Image"><span class="codicon codicon-file-media"></span></button>
            <span class="paper-reader-toolbar-spacer"></span>
            <button type="button" data-command="save" title="Save" aria-label="Save"><span class="codicon codicon-save"></span></button>
        </div>
        <div id="paper-reader-workspace">
            <aside id="paper-reader-outline" aria-label="Document outline" hidden></aside>
            <div id="paper-reader-editor" aria-label="Paper Reader Markdown editor"></div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="vditor-context-menu paper-reader-context-menu" id="paper-reader-context-menu" role="menu" hidden>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item" type="button" data-action="sendSelectionToCodex" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-comment-discussion"></span>
                </span>
                <span class="vditor-context-menu__label">Add to Codex</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="addSelectionToNotes" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-notebook"></span>
                </span>
                <span class="vditor-context-menu__label">Add Note</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="aiPolish" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-sparkle"></span>
                </span>
                <span class="vditor-context-menu__label">AI Polish</span>
            </button>
        </div>
        <div class="vditor-context-menu__separator" role="separator"></div>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item" type="button" data-action="copy" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-copy"></span>
                </span>
                <span class="vditor-context-menu__label">Copy</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="copyAsHtml" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-code"></span>
                </span>
                <span class="vditor-context-menu__label">Copy as HTML</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="copyAsPlainText" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-symbol-string"></span>
                </span>
                <span class="vditor-context-menu__label">Copy as Plain Text</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="paste" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-clippy"></span>
                </span>
                <span class="vditor-context-menu__label">Paste</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="insertImage" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-media"></span>
                </span>
                <span class="vditor-context-menu__label">Insert Image</span>
            </button>
        </div>
        <div class="vditor-context-menu__separator" role="separator"></div>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportPdf" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-pdf"></span>
                </span>
                <span class="vditor-context-menu__label">Export PDF</span>
            </button>
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportPdfWithoutOutline" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-pdf"></span>
                </span>
                <span class="vditor-context-menu__label">Export PDF (Without Outline)</span>
            </button>
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportDocx" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-text"></span>
                </span>
                <span class="vditor-context-menu__label">Export Docx</span>
            </button>
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportHtml" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-code"></span>
                </span>
                <span class="vditor-context-menu__label">Export HTML</span>
            </button>
        </div>
        <div class="vditor-context-menu__separator" role="separator"></div>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="showInFolder" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-folder-opened"></span>
                </span>
                <span class="vditor-context-menu__label">Show in Folder</span>
            </button>
        </div>
    </div>

</body>
    <script src="../lib/vscode.js"></script>
    <script src="codemirror.bundle.js"></script>

</html>
